services:

  backend:

    image: spotify-game-backend:dev

    build:
      context: ./backend

    environment:
      SPOTIPY_CLIENT_ID: ${SPOTIPY_CLIENT_ID}
      SPOTIPY_CLIENT_SECRET: ${SPOTIPY_CLIENT_SECRET}
      SPOTIPY_REDIRECT_URI: ${SPOTIPY_REDIRECT_URI}

    expose:
      - "8000"

    volumes:
      - spotify-cache:/app/.cache


  frontend:

    image: spotify-game-frontend:dev

    build:
      context: ./frontend

    ports:
      - "8080:80"

    depends_on:
      - backend


volumes:

  spotify-cache: